name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq
      - name: Run bats unit tests
        run: bats tests/unit
      - name: Run bats integration tests
        run: bats tests/integration

  server:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Build server
        working-directory: server
        run: npm run build
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Run tests
        working-directory: server
        run: npm test

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate marketplace.json
        run: jq . .claude-plugin/marketplace.json > /dev/null
      - name: Validate plugin.json
        run: jq . .claude-plugin/plugin.json > /dev/null
      - name: Validate .mcp.json
        run: jq . .mcp.json > /dev/null
      - name: Validate hooks.json
        run: jq . hooks/hooks.json > /dev/null
