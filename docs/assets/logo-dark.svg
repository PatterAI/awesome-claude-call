<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100" role="img" aria-label="claude-call">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"  stop-color="#4ee3ff"/>
      <stop offset="100%" stop-color="#ff4ec3"/>
    </linearGradient>
  </defs>

  <!-- waveform glyph -->
  <g transform="translate(10,30)" stroke-linecap="round" stroke-width="3" fill="none">
    <line x1="0"  y1="20" x2="0"  y2="20" stroke="#6e7889"/>
    <line x1="8"  y1="14" x2="8"  y2="26" stroke="#6e7889"/>
    <line x1="16" y1="6"  x2="16" y2="34" stroke="url(#g)"/>
    <line x1="24" y1="0"  x2="24" y2="40" stroke="url(#g)"/>
    <line x1="32" y1="6"  x2="32" y2="34" stroke="url(#g)"/>
    <line x1="40" y1="14" x2="40" y2="26" stroke="#6e7889"/>
    <line x1="48" y1="20" x2="48" y2="20" stroke="#6e7889"/>
  </g>

  <!-- wordmark -->
  <text x="78" y="60"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="30" font-weight="700" fill="#e6edf3" letter-spacing="-0.02em">
    claude<tspan fill="#ff4ec3">·</tspan>call
  </text>

  <!-- caret/cursor -->
  <rect x="201" y="40" width="3" height="22" fill="#4ee3ff"/>
</svg>
